services:
  yyb-go:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/yyb-go:58492557cc66
    container_name: yyb-go
    restart: unless-stopped
    command:
      - -host
      - 0.0.0.0
      - -port
      - "8000"
      - -resource-root
      - /app/resource
      - -keepalive-interval
      - ${YYB_KEEPALIVE_INTERVAL:-30m}
      - -keepalive-ahead
      - ${YYB_KEEPALIVE_AHEAD:-45m}
    environment:
      QL_URL: ${QL_URL:-http://qinglong:5700}
      QL_CLIENT_ID: ${QL_CLIENT_ID:-}
      QL_CLIENT_SECRET: ${QL_CLIENT_SECRET:-}
      YYB_QINGLONG_SERVER: ${YYB_QINGLONG_SERVER:-yyb-go:8000}
      YYB_QINGLONG_REPO: ${YYB_QINGLONG_REPO:-SuperNaiBA_YYB-GO-Script}
    volumes:
      - ./data/db:/app/resource/db
      - ./data/avatars:/app/resource/avatars
      - ./data/qr:/app/resource/qr
    networks:
      - qinglong
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  yyb-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: local/yyb-web:1.27
    container_name: yyb-web
    restart: unless-stopped
    depends_on:
      yyb-go:
        condition: service_healthy
    environment:
      YYB_WEB_USER: ${YYB_WEB_USER:-admin}
      YYB_WEB_PASSWORD: ${YYB_WEB_PASSWORD:?Set YYB_WEB_PASSWORD in .env}
    ports:
      - "${YYB_BIND_ADDRESS:-0.0.0.0}:${YYB_PORT:-8000}:8080"
    networks:
      - qinglong
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

networks:
  qinglong:
    external: true
    name: qinglong_default
