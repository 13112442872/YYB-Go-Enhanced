<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账号运行管理 - YYB Go</title>
  <style>
    :root {
      color-scheme: light;
      --bg: oklch(1 0 0); --bg-soft: oklch(0.974 0.004 250); --surface: oklch(0.986 0.004 250);
      --surface-strong: oklch(0.948 0.009 250); --ink: oklch(0.19 0.025 252); --muted: oklch(0.43 0.025 252);
      --faint: oklch(0.58 0.018 252); --line: oklch(0.885 0.012 250); --primary: oklch(0.54 0.205 3);
      --primary-hover: oklch(0.48 0.195 3); --accent: oklch(0.44 0.112 190); --accent-soft: oklch(0.94 0.027 190);
      --success: oklch(0.55 0.135 145); --warning-soft: oklch(0.955 0.04 78); --danger: oklch(0.55 0.18 25);
      --code-bg: oklch(0.16 0.022 252); --code-ink: oklch(0.96 0.006 250); --radius: 8px;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: var(--bg-soft); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input, select { font: inherit; } button { cursor: pointer; } [hidden] { display: none !important; }
    .topbar { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 12px 28px; background: var(--bg); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark { width: 36px; height: 36px; border-radius: var(--radius); display: grid; place-items: center; background: var(--ink); color: var(--bg); font-weight: 800; flex: 0 0 auto; }
    .brand h1 { margin: 0; font-size: 18px; line-height: 1.1; letter-spacing: 0; } .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .nav a, .btn { min-height: 36px; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; background: var(--bg); color: var(--ink); text-decoration: none; transition: background 160ms ease, border-color 160ms ease, color 160ms ease; }
    .nav a:hover, .btn:hover { background: var(--surface-strong); } .nav a[aria-current="page"] { color: var(--primary); border-color: var(--primary); font-weight: 700; }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--bg); font-weight: 700; } .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn.small { min-height: 32px; padding: 6px 9px; font-size: 13px; } .btn:disabled { cursor: not-allowed; opacity: .55; }
    .nav a:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, .toggle input:focus-visible + span { outline: 3px solid oklch(0.82 0.08 190); outline-offset: 2px; }
    main { width: min(1440px, 100%); margin: 0 auto; padding: 24px 28px 40px; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 18px; }
    .page-head h2 { margin: 0; font-size: 22px; letter-spacing: 0; text-wrap: balance; } .page-head p { margin: 6px 0 0; color: var(--muted); max-width: 72ch; text-wrap: pretty; }
    .connection { min-height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: 0 0 auto; } .connection.ok .dot { background: var(--success); } .connection.bad .dot { background: var(--danger); }
    .workspace { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .band { padding: 18px; border-bottom: 1px solid var(--line); } .band:last-child { border-bottom: 0; }
    .control-grid { display: grid; grid-template-columns: minmax(260px, 1.2fr) minmax(220px, .8fr) auto; gap: 12px; align-items: end; }
    .field { display: grid; gap: 6px; min-width: 0; } .field label { font-weight: 700; font-size: 13px; }
    .field input, .field select, .toolbar input, .toolbar select { width: 100%; min-height: 38px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--ink); padding: 8px 10px; }
    .field input::placeholder, .toolbar input::placeholder { color: var(--muted); opacity: 1; }
    .account-id { margin-top: 10px; color: var(--muted); overflow-wrap: anywhere; } .account-id code { color: var(--ink); }
    .push-head, .table-head, .log-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .section-title h3 { margin: 0; font-size: 16px; letter-spacing: 0; } .section-title p { margin: 4px 0 0; color: var(--muted); }
    .push-form { display: grid; grid-template-columns: minmax(170px, .7fr) minmax(240px, 1.3fr) minmax(170px, .7fr) auto; gap: 12px; align-items: end; margin-top: 14px; }
    .configured { color: var(--success); font-size: 12px; min-height: 17px; }
    .notice { margin-top: 14px; padding: 10px 12px; border: 1px solid oklch(0.86 0.06 78); border-radius: var(--radius); background: var(--warning-soft); color: oklch(0.36 0.07 72); } .notice strong { color: var(--ink); }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .toolbar input { width: min(280px, 42vw); }
    .table-wrap { margin: 14px -18px -18px; overflow-x: auto; } table { width: 100%; border-collapse: collapse; min-width: 820px; }
    th, td { padding: 11px 14px; border-top: 1px solid var(--line); text-align: left; vertical-align: middle; } th { background: var(--surface); color: var(--muted); font-size: 12px; white-space: nowrap; }
    td.name { min-width: 220px; } .script-name { display: block; font-weight: 700; } .script-path { display: block; margin-top: 2px; color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
    .state { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; } .state.enabled .dot { background: var(--success); } .state.running .dot { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); } .state.unready, .muted { color: var(--muted); }
    .row-actions { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .toggle { position: relative; display: inline-flex; align-items: center; } .toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .toggle span { width: 38px; height: 22px; border-radius: 999px; background: var(--surface-strong); border: 1px solid var(--line); position: relative; transition: background 160ms ease; }
    .toggle span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; border-radius: 50%; background: var(--bg); box-shadow: 0 1px 3px oklch(0.2 0.02 250 / .22); transition: transform 160ms ease; }
    .toggle input:checked + span { background: var(--success); border-color: var(--success); } .toggle input:checked + span::after { transform: translateX(16px); } .toggle input:disabled + span { opacity: .55; }
    .empty { padding: 32px 18px; text-align: center; color: var(--muted); border-top: 1px solid var(--line); }
    .skeleton { height: 14px; border-radius: 4px; background: var(--surface-strong); width: 72%; }
    .log-panel { background: var(--code-bg); color: var(--code-ink); } .log-panel .section-title p { color: oklch(0.76 0.012 250); } .log-panel .btn { background: transparent; border-color: oklch(0.38 0.02 252); color: var(--code-ink); }
    pre { margin: 14px 0 0; max-height: 440px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .toast { position: fixed; right: 18px; bottom: 18px; max-width: min(420px, calc(100vw - 36px)); padding: 10px 13px; border-radius: var(--radius); background: var(--ink); color: var(--bg); box-shadow: 0 8px 30px oklch(0.2 0.02 250 / .24); z-index: 30; } .toast.error { background: var(--danger); }
    @media (max-width: 900px) { .control-grid, .push-form { grid-template-columns: 1fr 1fr; } .control-grid .btn, .push-form .btn { width: 100%; } }
    @media (max-width: 700px) {
      .topbar { position: static; align-items: flex-start; padding: 14px 16px; } .brand p { display: none; } .nav { justify-content: flex-end; }
      .nav a { min-height: 34px; padding: 7px 9px; font-size: 13px; } main { padding: 18px 12px 28px; } .page-head, .push-head, .table-head { display: grid; }
      .control-grid, .push-form { grid-template-columns: 1fr; } .toolbar { display: grid; grid-template-columns: 1fr 132px; } .toolbar input { width: 100%; }
      .table-wrap { overflow: visible; } table { min-width: 0; } thead { display: none; } tbody, tr, td { display: block; width: 100%; }
      tr { padding: 12px 14px; border-top: 1px solid var(--line); } td { border: 0; padding: 5px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; text-align: right; }
      td::before { content: attr(data-label); color: var(--muted); font-size: 12px; flex: 0 0 76px; text-align: left; } td.name { min-width: 0; display: block; text-align: left; padding-bottom: 8px; } td.name::before { display: none; }
      .row-actions { justify-content: flex-end; flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="mark" aria-hidden="true">Y</div><div><h1>YYB Go</h1><p>微信账号与青龙任务控制台</p></div></div>
    <nav class="nav" aria-label="主导航"><a href="/">账号控制台</a><a href="/runs" aria-current="page">运行管理</a><a href="/scan">扫码添加</a><a href="/docs/index.html">Swagger</a></nav>
  </header>
  <main>
    <div class="page-head"><div><h2>账号运行管理</h2><p>每个微信账号使用独立青龙任务、独立开关和独立推送设置。</p></div><div class="connection" id="connection"><span class="dot"></span><span>正在连接青龙</span></div></div>
    <div class="workspace">
      <section class="band" aria-labelledby="accountHeading">
        <div class="control-grid">
          <div class="field"><label for="accountSelect" id="accountHeading">运行账号</label><select id="accountSelect"><option>正在加载账号</option></select></div>
          <div class="field"><label for="accountState">账号状态</label><input id="accountState" value="-" readonly></div>
          <button class="btn" type="button" id="reloadBtn">刷新状态</button>
        </div>
        <div class="account-id" id="accountIdentity">OpenID: -</div>
      </section>
      <section class="band" aria-labelledby="pushHeading">
        <div class="push-head"><div class="section-title"><h3 id="pushHeading">账号推送</h3><p>密钥保存在青龙账号专属环境变量中，页面不会回显。</p></div></div>
        <form class="push-form" id="pushForm">
          <div class="field"><label for="pushChannel">推送方式</label><select id="pushChannel"><option value="none">关闭推送</option><option value="serverchan">Server酱</option><option value="pushplus">PushPlus</option><option value="qywx">企业微信机器人</option></select></div>
          <div class="field" id="tokenField"><label for="pushToken">Token / Key</label><input id="pushToken" type="password" autocomplete="new-password" placeholder="填写新密钥"><span class="configured" id="tokenConfigured"></span></div>
          <div class="field" id="topicField" hidden><label for="pushTopic">PushPlus 群组编码</label><input id="pushTopic" autocomplete="off" placeholder="可选"><span class="configured" id="topicConfigured"></span></div>
          <button class="btn primary" type="submit" id="savePushBtn">保存推送</button>
        </form>
      </section>
      <section class="band" aria-labelledby="jobsHeading">
        <div class="table-head">
          <div class="section-title"><h3 id="jobsHeading">脚本任务</h3><p id="jobSummary">正在读取兼容脚本</p></div>
          <div class="toolbar"><input id="searchInput" type="search" placeholder="搜索脚本名称或路径" aria-label="搜索脚本"><select id="statusFilter" aria-label="筛选任务状态"><option value="all">全部状态</option><option value="enabled">已启用</option><option value="disabled">已停用</option><option value="running">运行中</option></select></div>
        </div>
        <div class="notice" id="duplicateNotice" hidden><strong>检测到旧全局任务仍启用。</strong> 同一脚本可能被全局任务和账号任务重复执行，请先在青龙中停用对应全局任务。</div>
        <div class="table-wrap">
          <table><thead><tr><th>脚本</th><th>Cron</th><th>运行状态</th><th>最近运行</th><th>定时开关</th><th>操作</th></tr></thead><tbody id="jobsBody"><tr><td class="name"><div class="skeleton"></div></td><td><div class="skeleton"></div></td><td><div class="skeleton"></div></td><td><div class="skeleton"></div></td><td><div class="skeleton"></div></td><td><div class="skeleton"></div></td></tr></tbody></table>
          <div class="empty" id="emptyState" hidden>没有符合条件的脚本。</div>
        </div>
      </section>
      <section class="band log-panel" id="logPanel" hidden aria-labelledby="logHeading"><div class="log-head"><div class="section-title"><h3 id="logHeading">运行日志</h3><p id="logMeta"></p></div><button class="btn small" type="button" id="closeLogBtn">关闭日志</button></div><pre id="logContent">正在读取日志</pre></section>
    </div>
  </main>
  <div class="toast" id="toast" hidden role="status"></div>
  <script>
    const state = { accounts: [], selectedRef: "", jobs: [], busy: new Set(), timer: null };
    const $ = id => document.getElementById(id);
    function escapeHTML(value) { return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;"); }
    async function api(method, url, body) {
      const options = { method, headers: { "Content-Type": "application/json" } }; if (body !== undefined) options.body = JSON.stringify(body);
      const response = await fetch(url, options); const text = await response.text(); let payload = null;
      try { payload = text ? JSON.parse(text) : null; } catch { payload = text; }
      const envelope = payload && typeof payload === "object" && !Array.isArray(payload) && "code" in payload && "data" in payload;
      if (!response.ok || (envelope && payload.code !== 0)) throw new Error(envelope ? payload.msg : `HTTP ${response.status}`); return envelope ? payload.data : payload;
    }
    function showToast(message, error = false) { const toast = $("toast"); toast.textContent = message; toast.classList.toggle("error", error); toast.hidden = false; clearTimeout(showToast.timer); showToast.timer = setTimeout(() => { toast.hidden = true; }, 3200); }
    function accountName(account) { return account.nickname || account.alias || account.openid || `账号 ${account.id}`; }
    function selectedAccount() { return state.accounts.find(item => String(item.id) === state.selectedRef) || null; }
    function formatTime(timestamp) { if (!timestamp) return "未运行"; return new Intl.DateTimeFormat("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(timestamp * 1000)); }
    async function loadConnection() {
      const pill = $("connection"); try { const result = await api("GET", "/api/qinglong/status"); pill.className = "connection " + (result.connected ? "ok" : "bad"); pill.lastElementChild.textContent = result.connected ? "青龙已连接" : (result.configured ? "青龙连接失败" : "青龙未配置"); pill.title = result.error || ""; }
      catch (error) { pill.className = "connection bad"; pill.lastElementChild.textContent = "青龙连接失败"; pill.title = error.message; }
    }
    async function loadAccounts() {
      state.accounts = await api("GET", "/accounts"); const select = $("accountSelect");
      if (!state.accounts.length) { select.innerHTML = '<option value="">暂无账号</option>'; state.selectedRef = ""; renderAccount(); return; }
      if (!state.accounts.some(item => String(item.id) === state.selectedRef)) state.selectedRef = String(state.accounts[0].id);
      select.innerHTML = state.accounts.map(account => `<option value="${account.id}">${escapeHTML(accountName(account))} · ID ${account.id}</option>`).join(""); select.value = state.selectedRef; renderAccount();
    }
    function renderAccount() { const account = selectedAccount(); $("accountState").value = account?.status === "alive" ? "可用" : account?.status === "expired" ? "需重新扫码" : "待确认"; $("accountIdentity").innerHTML = account ? `账号 ID: <code>${account.id}</code> · OpenID: <code>${escapeHTML(account.openid)}</code>` : "请先扫码添加账号"; }
    async function loadSelected() {
      if (!state.selectedRef) { state.jobs = []; renderJobs(); return; } $("jobSummary").textContent = "正在读取兼容脚本";
      try { const [jobsResult, push] = await Promise.all([api("GET", `/api/qinglong/jobs?ref=${encodeURIComponent(state.selectedRef)}`), api("GET", `/api/qinglong/push?ref=${encodeURIComponent(state.selectedRef)}`)]); state.jobs = jobsResult.jobs || []; applyPush(push); renderJobs(); }
      catch (error) { state.jobs = []; renderJobs(); $("jobSummary").textContent = `读取失败：${error.message}`; showToast(error.message, true); }
    }
    function applyPush(push) { $("pushChannel").value = push.channel || "none"; $("pushToken").value = ""; $("pushTopic").value = ""; $("tokenConfigured").textContent = push.token_configured ? "已配置，留空表示保留" : ""; $("topicConfigured").textContent = push.topic_configured ? "已配置，留空表示清空" : ""; syncPushFields(); }
    function syncPushFields() { const channel = $("pushChannel").value; $("tokenField").hidden = channel === "none"; $("topicField").hidden = channel !== "pushplus"; }
    function filteredJobs() { const query = $("searchInput").value.trim().toLowerCase(), filter = $("statusFilter").value; return state.jobs.filter(job => { const text = !query || job.name.toLowerCase().includes(query) || job.script_key.toLowerCase().includes(query); const status = filter === "all" || (filter === "enabled" && job.enabled) || (filter === "disabled" && !job.enabled) || (filter === "running" && job.running); return text && status; }); }
    function renderJobs() {
      const jobs = filteredJobs(), body = $("jobsBody"); body.innerHTML = jobs.map(job => {
        const key = escapeHTML(job.script_key), busy = state.busy.has(job.script_key), statusClass = job.running ? "running" : job.enabled ? "enabled" : "unready";
        const statusText = job.running ? "运行中" : job.enabled ? "定时已启用" : job.provisioned ? "定时已停用" : "尚未创建";
        const recent = job.last_execution_at ? `${formatTime(job.last_execution_at)}${job.last_running_time ? ` · ${job.last_running_time}s` : ""}` : "未运行";
        return `<tr><td class="name"><span class="script-name">${escapeHTML(job.name)}</span><span class="script-path">${key}</span></td><td data-label="Cron"><code>${escapeHTML(job.schedule)}</code></td><td data-label="状态"><span class="state ${statusClass}"><span class="dot"></span>${statusText}</span></td><td data-label="最近运行" class="muted">${recent}</td><td data-label="定时开关"><label class="toggle" title="${job.enabled ? "停用定时任务" : "启用定时任务"}"><input type="checkbox" data-action="toggle" data-key="${key}" ${job.enabled ? "checked" : ""} ${busy ? "disabled" : ""}><span></span></label></td><td data-label="操作"><div class="row-actions"><button class="btn small" data-action="run" data-key="${key}" ${busy ? "disabled" : ""}>运行一次</button><button class="btn small" data-action="log" data-key="${key}" ${!job.provisioned || busy ? "disabled" : ""}>查看日志</button></div></td></tr>`;
      }).join(""); $("emptyState").hidden = jobs.length > 0; $("jobSummary").textContent = `共 ${state.jobs.length} 个兼容脚本，当前显示 ${jobs.length} 个`;
      const duplicates = state.jobs.filter(job => job.global_task_active).length; $("duplicateNotice").hidden = duplicates === 0; if (duplicates) $("duplicateNotice").querySelector("strong").textContent = `检测到 ${duplicates} 个旧全局任务仍启用。`;
    }
    async function toggleJob(key, enabled) { state.busy.add(key); renderJobs(); try { await api("PUT", "/api/qinglong/jobs/enable", { ref: state.selectedRef, script_key: key, enabled }); showToast(enabled ? "已启用账号定时任务" : "已停用账号定时任务"); await loadJobsOnly(); } catch (error) { showToast(error.message, true); await loadJobsOnly(); } finally { state.busy.delete(key); renderJobs(); } }
    async function runJob(key) { const job = state.jobs.find(item => item.script_key === key); if (!confirm(`确认立即运行“${job?.name || key}”？\n只会使用当前选中的账号。`)) return; state.busy.add(key); renderJobs(); try { await api("POST", "/api/qinglong/jobs/run", { ref: state.selectedRef, script_key: key }); showToast("任务已提交到青龙"); setTimeout(loadJobsOnly, 1200); } catch (error) { showToast(error.message, true); } finally { state.busy.delete(key); renderJobs(); } }
    async function showLog(key) { const job = state.jobs.find(item => item.script_key === key); $("logPanel").hidden = false; $("logMeta").textContent = job?.name || key; $("logContent").textContent = "正在读取日志"; $("logPanel").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" }); try { const result = await api("GET", `/api/qinglong/jobs/log?ref=${encodeURIComponent(state.selectedRef)}&script_key=${encodeURIComponent(key)}`); $("logContent").textContent = result.log || "青龙尚未生成运行日志。"; } catch (error) { $("logContent").textContent = `日志读取失败：${error.message}`; } }
    async function loadJobsOnly() { if (!state.selectedRef || document.hidden) return; try { const result = await api("GET", `/api/qinglong/jobs?ref=${encodeURIComponent(state.selectedRef)}`); state.jobs = result.jobs || []; renderJobs(); } catch { } }
    $("accountSelect").addEventListener("change", async event => { state.selectedRef = event.target.value; renderAccount(); $("logPanel").hidden = true; await loadSelected(); });
    $("reloadBtn").addEventListener("click", async () => { await Promise.all([loadConnection(), loadAccounts()]); await loadSelected(); showToast("运行状态已刷新"); });
    $("pushChannel").addEventListener("change", syncPushFields);
    $("pushForm").addEventListener("submit", async event => { event.preventDefault(); if (!state.selectedRef) return; const button = $("savePushBtn"); button.disabled = true; const topic = $("pushChannel").value === "pushplus" ? $("pushTopic").value : null; try { const result = await api("PUT", "/api/qinglong/push", { ref: state.selectedRef, channel: $("pushChannel").value, token: $("pushToken").value, topic }); applyPush(result); showToast("账号推送设置已保存"); } catch (error) { showToast(error.message, true); } finally { button.disabled = false; } });
    $("jobsBody").addEventListener("change", event => { const input = event.target.closest('[data-action="toggle"]'); if (input) toggleJob(input.dataset.key, input.checked); });
    $("jobsBody").addEventListener("click", event => { const button = event.target.closest("button[data-action]"); if (!button) return; if (button.dataset.action === "run") runJob(button.dataset.key); if (button.dataset.action === "log") showLog(button.dataset.key); });
    $("searchInput").addEventListener("input", renderJobs); $("statusFilter").addEventListener("change", renderJobs); $("closeLogBtn").addEventListener("click", () => { $("logPanel").hidden = true; });
    (async function init() { try { await Promise.all([loadConnection(), loadAccounts()]); await loadSelected(); } catch (error) { showToast(error.message, true); } state.timer = setInterval(loadJobsOnly, 10000); })();
  </script>
</body>
</html>
