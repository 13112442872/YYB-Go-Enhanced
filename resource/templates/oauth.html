<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公众号网页授权 - YYB Go</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; color: #172033; background: #f5f7fb; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(760px, calc(100% - 32px)); margin: 32px auto; }
    .panel { background: #fff; border: 1px solid #dfe4ee; border-radius: 8px; padding: 24px; box-shadow: 0 8px 24px rgb(23 32 51 / 6%); }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .muted { color: #667085; }
    .grid { display: grid; gap: 14px; margin-top: 22px; }
    label { display: grid; gap: 6px; font-weight: 650; }
    input, select { min-height: 40px; padding: 8px 10px; border: 1px solid #cbd3e1; border-radius: 6px; font: inherit; }
    button, a.button { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 14px; border: 0; border-radius: 6px; color: #fff; background: #b51245; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .result { margin-top: 20px; padding: 14px; background: #f3f5f9; border-radius: 6px; overflow-wrap: anywhere; }
    .result a { display: block; margin-top: 8px; color: #9d0d3c; }
    .error { color: #b42318; }
    code { background: #eef1f6; padding: 2px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>微信公众号网页授权</h1>
      <p class="muted">生成官方 OAuth 授权链接。用户需要在微信中打开并确认，授权成功后由公众号回调地址接收 <code>code</code> 和 <code>state</code>。</p>
      <p class="muted">这不是公众号后台登录，也不会伪造或直接返回授权 code。</p>
      <form id="form" class="grid">
        <label>YYB 账号<select id="ref" required><option value="">正在加载账号...</option></select></label>
        <label>公众号 AppID<input id="appid" placeholder="wx...（18 位）" required></label>
        <label>回调地址<input id="redirect_uri" type="url" placeholder="https://example.com/callback" required></label>
        <label>授权范围<select id="scope"><option value="snsapi_base">snsapi_base（静默）</option><option value="snsapi_userinfo">snsapi_userinfo（用户确认）</option></select></label>
        <label>State（可选）<input id="state" maxlength="128" placeholder="留空自动生成随机值"></label>
        <div class="actions"><button id="submit" type="submit">生成授权链接</button><a class="button" href="/">返回控制台</a></div>
      </form>
      <div id="result" class="result muted">等待生成。</div>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const result = $('result');
    async function loadAccounts() {
      const response = await fetch('/accounts');
      if (!response.ok) throw new Error('账号列表加载失败');
      const accounts = await response.json();
      $('ref').innerHTML = accounts.length ? accounts.map(a => {
        const name = a.remark || a.nickname || a.alias || a.openid;
        return `<option value="${String(a.id)}">${escapeHTML(name)}（ID ${String(a.id)}）</option>`;
      }).join('') : '<option value="">暂无账号，请先扫码添加</option>';
    }
    function escapeHTML(value) { return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;'); }
    $('form').addEventListener('submit', async event => {
      event.preventDefault();
      $('submit').disabled = true;
      result.className = 'result muted';
      result.textContent = '正在生成...';
      try {
        const response = await fetch('/wx/oauth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({
          ref: $('ref').value, appid: $('appid').value, redirect_uri: $('redirect_uri').value,
          scope: $('scope').value, state: $('state').value
        })});
        const data = await response.json();
        if (!response.ok || data.code !== 0) throw new Error(data.msg || '生成失败');
        result.className = 'result';
        result.innerHTML = `<strong>授权链接已生成</strong><a href="${escapeHTML(data.data.full_url)}" target="_blank" rel="noopener">在新页面打开授权链接</a><p class="muted">回调 state：${escapeHTML(data.data.state)}</p>`;
      } catch (error) {
        result.className = 'result error';
        result.textContent = error.message;
      } finally { $('submit').disabled = false; }
    });
    loadAccounts().catch(error => { $('ref').innerHTML = '<option value="">账号加载失败</option>'; result.textContent = error.message; });
  </script>
</body>
</html>
