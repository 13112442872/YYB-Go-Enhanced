<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人设置 - YYB Go</title><link rel="stylesheet" href="/static/css/auth.css"></head><body><header class="shell-header"><div class="brand"><span class="brand-mark">Y</span><div class="brand-name">YYB Go</div></div><nav class="nav" id="nav"><a href="/settings" aria-current="true">个人设置</a></nav><div class="user-actions"><span class="user-label" id="userLabel"></span><button class="btn secondary" id="logout">退出</button></div></header><main class="page"><div class="page-title"><div><h1>个人设置</h1><p>维护显示信息、密码和当前登录会话。</p></div></div><div class="grid"><section class="card"><h2>基本信息</h2><p class="description">用户名用于登录，当前版本不支持自行修改。</p><form id="profileForm"><div class="field"><label>用户名</label><input class="input" id="username" disabled></div><div class="field"><label for="displayName">显示名</label><input class="input" id="displayName" maxlength="100" required></div><div class="notice" id="profileNotice" hidden></div><button class="btn primary" style="width:auto" type="submit">保存信息</button></form></section><section class="card"><h2>修改密码</h2><p class="description">修改后会自动注销其他设备上的会话。</p><form id="passwordForm"><div class="field"><label for="currentPassword">当前密码</label><input class="input" id="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="newPassword">新密码</label><input class="input" id="newPassword" type="password" autocomplete="new-password" minlength="10" required></div><div class="notice" id="passwordNotice" hidden></div><button class="btn primary" style="width:auto" type="submit">更新密码</button></form></section><section class="card" style="grid-column:1/-1"><h2>登录会话</h2><p class="description">查看仍有效的会话，或注销除本机以外的全部会话。</p><div class="session-list" id="sessions"></div><button class="btn danger" id="clearSessions">注销其他会话</button></section></div></main><script>const $=id=>document.getElementById(id);let me;async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options}),j=await r.json();if(!r.ok||j.code!==0)throw new Error(j.msg||'请求失败');return j.data}function notice(id,text,ok=true){const e=$(id);e.hidden=false;e.className='notice '+(ok?'ok':'');e.textContent=text}async function load(){const data=await api('/api/auth/me');me=data.user;$('username').value=me.username;$('displayName').value=me.display_name;$('userLabel').textContent=me.display_name;if(me.role==='admin')$('nav').insertAdjacentHTML('afterbegin','<a href="/">账号控制台</a><a href="/runs">运行管理</a><a href="/users">用户管理</a>');const sessions=await api('/api/auth/sessions');$('sessions').innerHTML=sessions.sessions.map(s=>`<div class="session"><div><strong>${s.id===sessions.current_session_id?'当前会话':'其他会话'}</strong><small>${escapeHTML(s.ip_address||'-')} · ${escapeHTML(s.user_agent||'未知设备')}</small></div><small>${new Date(s.last_seen_at).toLocaleString()}</small></div>`).join('')||'<div class="notice">没有有效会话</div>'}function escapeHTML(v){const e=document.createElement('span');e.textContent=v;return e.innerHTML}$('profileForm').onsubmit=async e=>{e.preventDefault();try{me=await api('/api/auth/profile',{method:'PUT',body:JSON.stringify({display_name:$('displayName').value})});$('userLabel').textContent=me.display_name;notice('profileNotice','基本信息已保存')}catch(err){notice('profileNotice',err.message,false)}};$('passwordForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/password',{method:'PUT',body:JSON.stringify({current_password:$('currentPassword').value,new_password:$('newPassword').value})});e.target.reset();notice('passwordNotice','密码已更新，其他会话已注销')}catch(err){notice('passwordNotice',err.message,false)}};$('clearSessions').onclick=async()=>{await api('/api/auth/sessions',{method:'DELETE'});await load()};$('logout').onclick=async()=>{await fetch('/logout',{method:'POST'});location.href='/login'};load().catch(e=>location.href='/login')</script></body></html>
