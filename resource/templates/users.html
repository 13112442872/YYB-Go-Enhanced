<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理 - YYB Go</title><link rel="stylesheet" href="/static/css/auth.css"></head><body><header class="shell-header"><div class="brand"><span class="brand-mark">Y</span><div class="brand-name">YYB Go</div></div><nav class="nav"><a href="/">账号控制台</a><a href="/runs">运行管理</a><a href="/users" aria-current="true">用户管理</a><a href="/settings">个人设置</a></nav><div class="user-actions"><span class="user-label" id="userLabel"></span><button class="btn secondary" id="logout">退出</button></div></header><main class="page"><div class="page-title"><div><h1>用户管理</h1><p>管理控制台用户、角色、状态和注册策略。</p></div><button class="btn primary" style="width:auto" id="addUser">新增用户</button></div><section class="card" style="margin-bottom:18px"><h2>注册设置</h2><p class="description">开启后登录页允许注册普通用户；新用户不会获得运维权限。</p><label><input type="checkbox" id="registration"> 允许新用户注册</label></section><section class="card"><div class="table-wrap"><table><thead><tr><th>用户</th><th>角色</th><th>状态</th><th>最后登录</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div></section></main><script>const $=id=>document.getElementById(id);let me;async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options}),j=await r.json();if(!r.ok||j.code!==0)throw new Error(j.msg||'请求失败');return j.data}const esc=v=>{const e=document.createElement('span');e.textContent=v??'';return e.innerHTML};async function load(){me=(await api('/api/auth/me')).user;$('userLabel').textContent=me.display_name;const [users,reg]=await Promise.all([api('/api/auth/users'),api('/api/auth/registration')]);$('registration').checked=reg.enabled;$('users').innerHTML=users.map(u=>`<tr><td><strong>${esc(u.display_name)}</strong><br><small>${esc(u.username)}</small></td><td><select class="input role" data-id="${u.id}" ${u.id===me.id?'disabled':''}><option value="user" ${u.role==='user'?'selected':''}>普通用户</option><option value="admin" ${u.role==='admin'?'selected':''}>管理员</option></select></td><td><span class="badge ${u.enabled?'ok':''}">${u.enabled?'启用':'停用'}</span></td><td>${u.last_login_at?new Date(u.last_login_at).toLocaleString():'-'}</td><td>${new Date(u.created_at).toLocaleDateString()}</td><td><div class="row-actions"><button class="btn secondary state" data-id="${u.id}" data-enabled="${!u.enabled}" ${u.id===me.id?'disabled':''}>${u.enabled?'停用':'启用'}</button><button class="btn secondary reset" data-id="${u.id}">重置密码</button></div></td></tr>`).join('');document.querySelectorAll('.role').forEach(e=>e.onchange=()=>update(e.dataset.id,e.value,true));document.querySelectorAll('.state').forEach(e=>e.onclick=()=>update(e.dataset.id,e.closest('tr').querySelector('.role').value,e.dataset.enabled==='true'));document.querySelectorAll('.reset').forEach(e=>e.onclick=()=>resetPassword(e.dataset.id))}async function update(id,role,enabled){try{await api(`/api/auth/users/${id}/state`,{method:'PUT',body:JSON.stringify({role,enabled})});load()}catch(e){alert(e.message);load()}}async function resetPassword(id){const password=prompt('输入新密码（至少 10 个字符）');if(!password)return;try{await api(`/api/auth/users/${id}/password`,{method:'PUT',body:JSON.stringify({password})});alert('密码已重置，该用户的会话已注销')}catch(e){alert(e.message)}}$('registration').onchange=async e=>{try{await api('/api/auth/registration',{method:'PUT',body:JSON.stringify({enabled:e.target.checked})})}catch(err){alert(err.message);load()}};$('addUser').onclick=async()=>{const username=prompt('用户名（小写字母、数字、点、下划线或连字符）');if(!username)return;const displayName=prompt('显示名',username);if(!displayName)return;const password=prompt('初始密码（至少 10 个字符）');if(!password)return;try{await api('/api/auth/users',{method:'POST',body:JSON.stringify({username,display_name:displayName,password,role:'user'})});load()}catch(e){alert(e.message)}};$('logout').onclick=async()=>{await fetch('/logout',{method:'POST'});location.href='/login'};load().catch(e=>alert(e.message))</script></body></html>
